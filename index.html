<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeEase Medical Equipment | Flagstaff & Northern AZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0056b3; 
            --secondary: #28a745; 
            --text-dark: #000000;
            --text-light: #f9f9f9;
            --bg-soft: #f4f7f6;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: #000000;
            line-height: 1.6;
            background-color: var(--bg-soft);
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0, 86, 179, 0.05), rgba(0, 86, 179, 0.05)),
                        url('HEBackGround.png'); 
            background-size: cover;
            background-position: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(10px); 
            max-width: 600px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo-area img { max-width: 100%; height: auto; }

        .location-tag {
            background: #e1ecf7;
            color: #000000;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            margin: 20px 0;
        }

        .pitch { font-size: 1.1rem; color: #000000; margin-bottom: 30px; font-weight: 500; }

        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 15px 35px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 6px rgba(0, 86, 179, 0.2);
            font-size: 1rem;
        }

        .btn:hover { background-color: #004494; transform: translateY(-2px); }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 20px; font-size: 1.5rem;
            cursor: pointer; color: #666;
        }

        .modal-content h2 { margin-top: 0; color: var(--primary); font-size: 1.5rem; }

        form { display: flex; flex-direction: column; gap: 15px; text-align: left; }
        label { font-weight: 600; font-size: 0.9rem; color: #000; }
        input, select, textarea { padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 1rem; color: #000; }

        .submit-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; }

        .contact-info { margin-top: 40px; padding-top: 25px; border-top: 1px solid #000; font-size: 0.95rem; }
        .contact-info p { margin: 5px 0; color: #000; font-weight: 600; }

        @media (max-width: 480px) { .card { padding: 30px 20px; } }
    </style>
</head>
<body>

    <section class="hero">
        <div class="card">
            <header class="logo-area">
                <img src="HEConcept2B.png" alt="HomeEase Medical Equipment">
            </header>
            <div class="location-tag">Serving Flagstaff & Surrounding Areas</div>
            <div class="pitch">
                <p>Independence starts at home. <strong>HomeEase</strong> provides high-quality medical equipment and expert support to help you live safely and comfortably.</p>
            </div>
            <button class="btn" onclick="openModal()">Request More Info</button>
            <div class="contact-info">
                <p><strong>Call Us:</strong> (928) 525-6434</p>
                <p><strong>Email:</strong> support@homeeasedme.com</p>
                <p>Flagstaff, Arizona</p>
            </div>
        </div>
    </section>

    <div class="modal-overlay" id="infoModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2>Information Request</h2>
            <form id="requestForm">
                <label>Full Name</label>
                <input type="text" name="name" required>
                <label>Email Address</label>
                <input type="email" name="email" required>
                <label>Equipment Needed</label>
                <select name="equipment">
                    <option value="Mobility Aid">Mobility Aid</option>
                    <option value="Bedroom Safety">Bedroom Safety</option>
                    <option value="Bathroom Safety">Bathroom Safety</option>
                    <option value="Other">Other / Not Sure</option>
                </select>
                <label>How can we help?</label>
                <textarea name="message" rows="3"></textarea>
                <button type="submit" class="submit-btn" id="submitBtn">Send Request</button>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('infoModal');
        function openModal() { modal.style.display = 'flex'; }
        function closeModal() { modal.style.display = 'none'; }
        window.onclick = function(e) { if (e.target == modal) closeModal(); }

        document.getElementById('requestForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Sending...";

            const data = Object.fromEntries(new FormData(this).entries());

            try {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    body: JSON.stringify(data),
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    alert("Request sent successfully!");
                    this.reset();
                    closeModal();
                } else {
                    alert("Something went wrong. Please try again.");
                }
            } catch (err) {
                alert("Error connecting to server.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Send Request";
            }
        });
    </script>
</body>
</html>
